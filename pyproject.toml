[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "effortgate"
version = "0.1.0"
description = "Universal Multi-Provider AI Gateway with Adaptive Effort Sizing & Token Protection"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "tiktoken>=0.5.0",
    "redis>=5.0.0",
    "litellm>=1.0.0",
    "httpx>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
effortgate = "effortgate.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["effortgate*"]
